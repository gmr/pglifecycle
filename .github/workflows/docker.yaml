name: Docker

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]

permissions: {}

# A superseded run has nothing to say, and an emulated arm64 build is too slow to
# leave running for the sake of an answer nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request only has to prove the image still builds, so it publishes nothing
  # and is handed no token scope that could publish.
  #
  # amd64 only, and no QEMU: it is native on this runner. The crate is pure Rust apart
  # from the generated tree-sitter parser, so an arm64 break that amd64 misses is
  # unlikely enough to be worth catching after the merge instead of emulating arm64 on
  # every pull request.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/gmr/pglifecycle
          # The tags carry no `v` prefix, so match the bare semver form. A prerelease
          # tag gets only its own full version and no moving tag: `latest` and
          # `{{major}}` must keep pointing at the last stable release.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
