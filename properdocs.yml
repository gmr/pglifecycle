site_name: pglifecycle
site_description: A PostgreSQL schema management tool
site_url: https://gmr.github.io/pglifecycle/
repo_url: https://github.com/gmr/pglifecycle
repo_name: gmr/pglifecycle

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  # The schema reference is generated from schemata/*.yml at build time
  - gen-files:
      scripts:
        - bin/generate-schema-docs.py
  - literate-nav:
      nav_file: SUMMARY.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/pglifecycle.css

extra:
  social:
    - icon: material/web
      link: https://pglifecycle.com/
      name: pglifecycle.com
    - icon: fontawesome/brands/github
      link: https://github.com/gmr/pglifecycle
      name: gmr/pglifecycle

nav:
  - Home: index.md
  - Commands: commands.md
  - Project Format: project-format.md
  - Schema Reference: reference/
  - GitHub Actions: github-actions.md
