---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://gmr.github.io/pglifecycle/schemata/subscription.json
title: Subscription
description: >
  The subscription represents a replication connection to the publisher.
type: object
properties:
  name:
    title: Subscription Name
    description: The name of the subscription to create
    type: string
  connection:
    title: Connection Information
    description: The connection string to the publisher.
    type: string
  publications:
    title: Publications
    description: Publications to subscribe to on the publisher
    type: array
    items:
      type: string
    minItems: 1
  parameters:
    title: Subscription Parameters
    type: object
    properties:
      copy_data:
        title: Copy Data
        description: >
          Specifies whether the existing data in the publications that are
          being subscribed to should be copied once the replication starts.
        type: boolean
        default: true
      create_slot:
        title: Create Replication Slot
        description: >
          Specifies whether the command should create the replication slot on
          the publisher.
        type: boolean
        default: true
      enabled:
        title: Replication Enabled
        description: >
          Specifies whether the subscription should be actively replicating, or
          whether it should be just setup but not started yet.
        type: boolean
        default: true
      slot_name:
        title: Slot Name
        description: >
          Name of the replication slot to use. The default behavior is to use
          the name of the subscription for the slot name.

          When slot_name is set to NONE, there will be no replication slot
          associated with the subscription. This can be used if the replication
          slot will be created later manually. Such subscriptions must also
          have both enabled and create_slot set to false.
        type: string
      synchronous_commit:
        title: Synchronous Commit
        description: >
          The value of this parameter overrides the synchronous_commit setting.
        enum: [on, remote_apply, remote_write, local, off]
        default: off
      binary:
        title: Binary
        description: >
          Specifies whether the subscription requests the publisher to send
          the data in binary format.
        type: boolean
        default: false
      streaming:
        title: Streaming
        description: >
          Specifies whether to enable streaming of in-progress transactions.
        oneOf:
          - type: boolean
          - enum: ["on", "off", parallel]
        default: parallel
      two_phase:
        title: Two Phase
        description: >
          Specifies whether two-phase commit is enabled for this
          subscription.
        type: boolean
        default: false
      disable_on_error:
        title: Disable on Error
        description: >
          Specifies whether the subscription is disabled automatically when
          an error occurs on the subscriber.
        type: boolean
        default: false
      password_required:
        title: Password Required
        description: >
          Specifies whether the connection to the publisher must use a
          password.
        type: boolean
        default: true
      run_as_owner:
        title: Run as Owner
        description: >
          Specifies whether replication runs as the subscription owner,
          and not as the owner of each table.
        type: boolean
        default: false
      failover:
        title: Failover
        description: >
          Specifies whether the replication slot is synchronized to the
          standby servers of the publisher.
        type: boolean
        default: false
      origin:
        title: Origin
        description: >
          Specifies whether to request only the changes that have no
          origin (none), or all changes (any).
        enum: [any, none]
        default: any
      connect:
        title: Connect
        description: >
          Specifies whether the subscription should connect to the publisher at
          all. Setting this to false will change default values of enabled,
          create_slot and copy_data to false.

          It is not allowed to combine connect set to false and enabled,
          create_slot, or copy_data set to true.
        type: boolean
        default: true
    additionalProperties: false
  comment:
    title: Comment
    description: An optional comment about the publication
    type: string
  security_labels:
    title: Security Labels
    $package_schema: security_labels
required:
  - name
  - connection
  - publications
additionalProperties: false
