---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://gmr.github.io/pglifecycle/schemata/operators.json
title: Operators
description: Specifies all user-defined operators in a schema
type: object
properties:
  schema:
    title: Schema
    description: The schema every object in this file belongs to.
    type: string
  owner:
    title: Owner
    description: >
      The role that owns every object in this file, unless an entry names its
      own. Defaults to the project's superuser.
    type: string
  operators:
    title: User-defined operators
    type: array
    items:
      $package_schema: operator
required:
  - schema
  - operators
additionalProperties: false
