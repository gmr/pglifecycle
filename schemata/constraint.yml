---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://gmr.github.io/pglifecycle/schemata/constraint.json
title: Constraint
description: Defines a constraint
type: object
properties:
  name:
    title: Name
    description: The constraint name
    type: string
  enforced:
    title: Enforced
    description: >
      false renders NOT ENFORCED (PostgreSQL 18+), which stops the constraint
      being checked. PostgreSQL records a not-enforced constraint as not
      validated as well. Absent means enforced, the default.
    type: boolean
  not_valid:
    title: Not Valid
    description: >
      true renders NOT VALID: rows already in the table were never
      checked, only new ones are. The state holds only when the
      constraint is added with ALTER TABLE, so the build writes it
      that way. Absent means valid, the default.
    type: boolean
