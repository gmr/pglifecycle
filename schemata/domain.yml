---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://gmr.github.io/pglifecycle/schemata/domain.json
title: Domain
description: Creates a user-defined data type with optional constraints.
type: object
properties:
  name:
    title: Name
    description: The name of the domain function to create.
    type: string
  schema:
    title: Schema
    description: The schema to create the domain function in.
    type: string
  owner:
    title: Owner
    description: The role that owns the domain function.
    type: string
  sql:
    title: SQL Statement
    description: User-provided raw SQL snippet
    type: string
  data_type:
    title: Data Type
    description: The underlying data type of the domain.
    type: string
  collation:
    title: Collation
    description: >
      An optional collation for the domain. If no collation is specified, the
      underlying data type's default collation is used. The underlying type must
      be collatable if COLLATE is specified.
    type: string
  default:
    title: Default
    description: >
      The DEFAULT clause specifies a default value for columns of the domain data
      type. The value is any variable-free expression (but subqueries are not
      allowed). The data type of the default expression must match the data type
      of the domain. If no default value is specified, then the default value
      is the null value.
    oneOf:
      - type: boolean
      - type: "null"
      - type: number
      - type: string
  check_constraints:
    title: An array of one or more check constraints
    type: array
    items:
      title: Constraint
      type: object
      properties:
        name:
          title: Constraint Name
          type: string
        nullable:
          title: Domain is Nullable
          type: boolean
        expression:
          title: Constraint Expression
          type: string
        not_valid:
          title: Not Valid
          description: >
            true renders NOT VALID: values already in columns of the domain
            were never checked, only new ones are. Only a CHECK can be NOT
            VALID, and only ALTER DOMAIN can add it, so the build writes it
            that way. Absent means valid, the default.
          type: boolean
        comment:
          title: Comment
          description: An optional comment about the constraint.
          type: string
      oneOf:
        - required: [expression]
          not: {required: [nullable]}
        - required: [nullable]
          not: {required: [expression]}
      additionalProperties: false
    uniqueItems: true
  comment:
    title: Comment
    description: An optional comment about the domain.
    type: string
  security_labels:
    title: Security Labels
    $package_schema: security_labels
  dependencies:
    title: Dependencies
    description: Database objects this object is dependent upon
    $package_schema: dependencies
required:
  - name
  - schema
additionalProperties: false
oneOf:
  - required:
      - sql
    not:
      required:
        - data_type
        - check_constraints
  - required:
      - data_type
    not:
      required:
        - sql
