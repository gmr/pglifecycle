---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://gmr.github.io/pglifecycle/schemata/project.json
title: Project
description: >
  `project.yaml` at the root of a project: the database-wide settings, and the
  objects that belong to the database rather than to a schema.
type: object
properties:
  name:
    description: The name of the database that is saved in the build artifact when generating a dump.
    type: string
  encoding:
    description: >
      Obsolete. The text of a project is UTF-8, and build always writes the
      archive in UTF8; pg_restore converts the text to the encoding of the
      database. A project loads only if the value names UTF8 (for example
      `UTF8`, `UTF-8` or `Unicode`). Remove the field.
    type: string
    deprecated: true
  stdstrings:
    description: >
      Obsolete. The SQL of a project is written with
      `standard_conforming_strings` on, and build always writes the archive
      so. A project loads only if the value is `true`. Remove the field.
    type: boolean
    deprecated: true
  comment:
    title: Comment
    description: >
      An optional comment about the database (`COMMENT ON DATABASE`)
    type: string
  connection_limit:
    title: Connection Limit
    description: >
      The number of concurrent connections that the database allows
      (`ALTER DATABASE ... CONNECTION LIMIT`). -1, the default, means no
      limit. Absent is the same as -1.
    type: integer
    minimum: -1
    maximum: 2147483647
  is_template:
    title: Is Template
    description: >
      true makes the database a template (`ALTER DATABASE ... IS_TEMPLATE`):
      a user with CREATEDB can clone it. Absent is the same as false, the
      default.
    type: boolean
  superuser:
    description: The PostgreSQL super user
    type: string
    default: postgres
  extensions:
    description: An array of PostgreSQL extensions to load into the database
    type: array
    items:
      type: object
      properties:
        name:
          description: >
            The name of the extension to be installed. PostgreSQL will create the
            extension using details from the file SHAREDIR/extension/extension_name.control.
          type: string
        schema:
          description: >
            The name of the schema in which to install the extension's objects,
            given that the extension allows its contents to be relocated.
          type: string
        version:
          description: >
            The version of the extension to install. This can be written as either an
            identifier or a string literal. The default version is whatever is
            specified in the extension's control file.
          type: string
        cascade:
          description: >
            Automatically install any extensions that this extension depends on
            that are not already installed.
          type: boolean
          default: false
        comment:
          title: Comment
          description: An optional comment about the extension
          type: string
      required:
        - name
  foreign_data_wrappers:
    title: Foreign Data Wrappers
    description: An array of Foreign Data Wrappers to create in the database
    type: array
    items:
      $package_schema: foreign_data_wrapper
  access_methods:
    title: Access Methods
    description: An array of table and index access methods to create
    type: array
    items:
      $package_schema: access_method
  languages:
    description: An array of Procedural Languages to load into the database
    type: array
    items:
      type: object
      properties:
        name:
          description: The name of the language to load
          type: string
        comment:
          title: Comment
          description: An optional comment about the language
          type: string
        trusted:
          description: >
            Specifies if the language grants access to data that the user would not
            otherwise have access to.
          type: boolean
          default: false
        replace:
          description: Use CREATE or REPLACE syntax
          type: boolean
          default: false
        handler:
          description: >
            Specifies the name of a previously registered function that will
            be called to execute the procedural language's functions.
          type: string
        inline_handler:
          description: >
            Specifies the name of a previously registered function that will be
            called to execute an anonymous code block (DO command) in this language.
          type: string
        validator:
          description: >
            Specifies the name of a previously registered function that will
            be called when a new function in the language is created, to validate
            the new function.
          type: string
      required:
        - name
  settings:
    title: Settings
    description: >
      Configuration parameters to be set to the specified value when a
      session connects to the database (`ALTER DATABASE ... SET`), one
      object for each parameter. A value is a string, a number or a
      boolean. A setting that PostgreSQL keeps as a list of names, such as
      search_path, is a list of strings, one name for each item. For such a
      setting, one string with a comma is an error, because PostgreSQL
      reads it as one name. A list has at least one item.
    type: array
    items:
      type: object
      propertyNames:
        pattern: ^[A-Za-z_][A-Za-z0-9_\.]*$
      additionalProperties:
        oneOf:
          - type: [string, number, boolean]
          - type: array
            minItems: 1
            items:
              type: string
  role_settings:
    title: Role Settings
    description: >
      Configuration parameters to be set when a role connects to the
      database (`ALTER ROLE ... IN DATABASE ... SET`), keyed by role name.
      Each value has the form of `settings`. The role does not have to be
      in the project.
    type: object
    additionalProperties:
      type: array
      items:
        type: object
        propertyNames:
          pattern: ^[A-Za-z_][A-Za-z0-9_\.]*$
        additionalProperties:
          oneOf:
            - type: [string, number, boolean]
            - type: array
              minItems: 1
              items:
                type: string
required:
  - name
additionalProperties: false
