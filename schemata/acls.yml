---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://gmr.github.io/pglifecycle/schemata/acls.json
title: ACLs
description: >
  Privileges on database objects, grouped by the kind of object they are on.
  Written under `grants:` or `revocations:` on the role, user, or group they
  apply to, so a role file is the whole story of what that role can do.

  `ALL` stands for every privilege the object type has. Append
  ` WITH GRANT OPTION` to a privilege to let the grantee grant it onward.
type: object
properties:
  columns:
    description: >
      Privileges on individual columns, keyed by `schema.table.column`.
    type: object
    propertyNames:
      pattern: ^([A-Za-z0-9_\-]+)\.([A-Za-z0-9_\-]+)\.([A-Za-z0-9_\-]+)$
    patternProperties:
      "^.*$":
        type: array
        items:
          pattern: "^(SELECT|INSERT|UPDATE|REFERENCES|ALL)( WITH GRANT OPTION)?$"
  databases:
    description: >
      Privileges on databases, keyed by database name.
    type: object
    propertyNames:
      pattern: ^([A-Za-z_\-\.])+$
    patternProperties:
      "^.*$":
        type: array
        items:
          pattern: "^(CREATE|CONNECT|TEMP|TEMPORARY|ALL)( WITH GRANT OPTION)?$"
  domains:
    description: >
      Privileges on domains, keyed by `schema.domain`.
    type: object
    propertyNames:
      pattern: ^([A-Za-z0-9_\-]+)\.([A-Za-z0-9_\-]+)$
    patternProperties:
      "^.*$":
        type: array
        items:
          pattern: "^(USAGE|ALL)( WITH GRANT OPTION)?$"
  foreign_data_wrappers:
    description: >
      Privileges on foreign data wrappers, keyed by wrapper name.
    type: object
    propertyNames:
      pattern: ^([A-Za-z0-9_\-\.]+)$
    patternProperties:
      "^.*$":
        type: array
        items:
          pattern: "^(USAGE|ALL)( WITH GRANT OPTION)?$"
  foreign_servers:
    description: >
      Privileges on foreign servers, keyed by server name.
    type: object
    propertyNames:
      pattern: ^([A-Za-z0-9_\-\.]+)$
    patternProperties:
      "^.*$":
        type: array
        items:
          pattern: "^(USAGE|ALL)( WITH GRANT OPTION)?$"
  functions:
    description: >
      Privileges on functions and procedures, keyed by
      `schema.function(argument types)`: the signature, since the name alone
      is ambiguous across overloads.
    type: object
    propertyNames:
      pattern: ^([A-Za-z0-9_\-]+)\.([A-Za-z0-9_\-]+)\((.*)\)$
    patternProperties:
      "^.*$":
        type: array
        items:
          pattern: "^(EXECUTE|ALL)( WITH GRANT OPTION)?$"
  groups:
    title: Role Memberships
    description: >
      Memberships in other roles. Each entry is the role name on its own when
      the membership behaves the way `GRANT <role> TO <member>` grants it, or a
      mapping when it does not.

      `admin: true` writes WITH ADMIN OPTION. `inherit` and `set` write the
      per-membership WITH INHERIT / WITH SET options, which need PostgreSQL 16
      or later; omit `inherit` to defer to the member role's own `inherit`
      option, which is what PostgreSQL does.

      The grantor (`GRANTED BY`) is not carried: it records who granted the
      membership in one cluster, not what the schema is.
    type: array
    items:
      oneOf:
        - title: Role Name
          type: string
        - title: Membership With Options
          type: object
          properties:
            role:
              title: Role Name
              type: string
            admin:
              title: WITH ADMIN OPTION
              description: >
                Whether the member may in turn grant this role to others.
              type: boolean
            inherit:
              title: WITH INHERIT
              description: >
                Whether the member automatically uses this role's privileges.
                Omit to defer to the member role's own `inherit` option.
              type: boolean
            set:
              title: WITH SET
              description: >
                Whether the member may SET ROLE to this role.
              type: boolean
          required:
            - role
          additionalProperties: false
    uniqueItems: true
  languages:
    description: >
      Privileges on procedural languages, keyed by language name.
    type: object
    propertyNames:
      pattern: ^([A-Za-z0-9_\-\.]+)$
    patternProperties:
      "^.*$":
        type: array
        items:
          pattern: "^(USAGE|ALL)( WITH GRANT OPTION)?$"
  large_objects:
    description: >
      Privileges on large objects, keyed by OID.
    type: object
    propertyNames:
      pattern: ^[0-9]+$
    patternProperties:
      "^.*$":
        type: array
        items:
          pattern: "^(SELECT|UPDATE|ALL)( WITH GRANT OPTION)?$"
  roles:
    title: Role Memberships
    description: >
      Memberships in other roles. Each entry is the role name on its own when
      the membership behaves the way `GRANT <role> TO <member>` grants it, or a
      mapping when it does not.

      `admin: true` writes WITH ADMIN OPTION. `inherit` and `set` write the
      per-membership WITH INHERIT / WITH SET options, which need PostgreSQL 16
      or later; omit `inherit` to defer to the member role's own `inherit`
      option, which is what PostgreSQL does.

      The grantor (`GRANTED BY`) is not carried: it records who granted the
      membership in one cluster, not what the schema is.
    type: array
    items:
      oneOf:
        - title: Role Name
          type: string
        - title: Membership With Options
          type: object
          properties:
            role:
              title: Role Name
              type: string
            admin:
              title: WITH ADMIN OPTION
              description: >
                Whether the member may in turn grant this role to others.
              type: boolean
            inherit:
              title: WITH INHERIT
              description: >
                Whether the member automatically uses this role's privileges.
                Omit to defer to the member role's own `inherit` option.
              type: boolean
            set:
              title: WITH SET
              description: >
                Whether the member may SET ROLE to this role.
              type: boolean
          required:
            - role
          additionalProperties: false
    uniqueItems: true
  schemata:
    description: >
      Privileges on schemas, keyed by schema name.
    type: object
    propertyNames:
      pattern: ^([A-Za-z0-9_\-]+)$
    patternProperties:
      "^.*$":
        type: array
        items:
          pattern: "^(CREATE|USAGE|ALL)( WITH GRANT OPTION)?$"
  sequences:
    description: >
      Privileges on sequences, keyed by `schema.sequence`.
    type: object
    propertyNames:
      pattern: ^([A-Za-z0-9_\-]+)\.([A-Za-z0-9_\-]+)$
    patternProperties:
      "^.*$":
        type: array
        items:
          pattern: "^(SELECT|UPDATE|USAGE|ALL)( WITH GRANT OPTION)?$"
  tables:
    description: >
      Privileges on tables, keyed by `schema.table`. Privileges on a view may
      be written here or under `views`: PostgreSQL grants on a view with TABLE
      syntax, so both emit `GRANT ... ON TABLE`.
    type: object
    propertyNames:
      pattern: ^([A-Za-z0-9_\-]+)\.([A-Za-z0-9_\-]+)$
    patternProperties:
      "^.*$":
        type: array
        items:
          pattern: "^(SELECT|INSERT|UPDATE|DELETE|TRUNCATE|REFERENCES|TRIGGER|MAINTAIN|ALL)( WITH GRANT OPTION)?$"
  tablespaces:
    description: >
      Privileges on tablespaces, keyed by tablespace name.
    type: object
    propertyNames:
      pattern: ^([A-Za-z0-9_\-]+)$
    patternProperties:
      "^.*$":
        type: array
        items:
          pattern: "^(CREATE|USAGE|ALL)( WITH GRANT OPTION)?$"
  types:
    description: >
      Privileges on types, keyed by `schema.type`.
    type: object
    propertyNames:
      pattern: ^([A-Za-z0-9_\-]+)\.([A-Za-z0-9_\-]+)$
    patternProperties:
      "^.*$":
        type: array
        items:
          pattern: "^(USAGE|ALL)( WITH GRANT OPTION)?$"
  views:
    description: >
      Privileges on views, keyed by `schema.view`. Emitted as `GRANT ... ON
      TABLE`, as PostgreSQL requires.
    type: object
    propertyNames:
      pattern: ^([A-Za-z0-9_\-]+)\.([A-Za-z0-9_\-]+)$
    patternProperties:
      "^.*$":
        type: array
        items:
          pattern: "^(SELECT|ALL)( WITH GRANT OPTION)?$"
additionalProperties: false
