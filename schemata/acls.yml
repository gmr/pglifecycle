---
$schema: http://json-schema.org/schema#
$id: https://pglifecycle.readthedocs.io/en/stable/schemata/acls.html
title: ACLs
type: object
properties:
  columns:
    type: object
    propertyNames:
      pattern: ^([A-Za-z0-9_\-]+)\.([A-Za-z0-9_\-]+)\.([A-Za-z0-9_\-]+)$
    patternProperties:
      "^.*$":
        type: array
        items:
          pattern: "^(SELECT|INSERT|UPDATE|REFERENCES|ALL)( WITH GRANT OPTION)?$"
  databases:
    type: object
    propertyNames:
      pattern: ^([A-Za-z_\-\.])+$
    patternProperties:
      "^.*$":
        type: array
        items:
          pattern: "^(CREATE|CONNECT|TEMP|TEMPORARY|ALL)( WITH GRANT OPTION)?$"
  domains:
    type: object
    propertyNames:
      pattern: ^([A-Za-z0-9_\-]+)\.([A-Za-z0-9_\-]+)$
    patternProperties:
      "^.*$":
        type: array
        items:
          pattern: "^(USAGE|ALL)( WITH GRANT OPTION)?$"
  foreign_data_wrappers:
    type: object
    propertyNames:
      pattern: ^([A-Za-z0-9_\-\.]+)$
    patternProperties:
      "^.*$":
        type: array
        items:
          pattern: "^(USAGE|ALL)( WITH GRANT OPTION)?$"
  foreign_servers:
    type: object
    propertyNames:
      pattern: ^([A-Za-z0-9_\-\.]+)$
    patternProperties:
      "^.*$":
        type: array
        items:
          pattern: "^(USAGE|ALL)( WITH GRANT OPTION)?$"
  functions:
    type: object
    propertyNames:
      pattern: ^([A-Za-z0-9_\-]+)\.([A-Za-z0-9_\-]+)\((.*)\)$
    patternProperties:
      "^.*$":
        type: array
        items:
          pattern: "^(EXECUTE|ALL)( WITH GRANT OPTION)?$"
  groups:
    title: Role Memberships
    description: >
      Memberships in other roles. Each entry is the role name on its own when
      the membership behaves the way `GRANT <role> TO <member>` grants it, or a
      mapping when it does not.

      `admin: true` writes WITH ADMIN OPTION. `inherit` and `set` write the
      per-membership WITH INHERIT / WITH SET options, which need PostgreSQL 16
      or later; omit `inherit` to defer to the member role's own `inherit`
      option, which is what PostgreSQL does.

      The grantor (`GRANTED BY`) is not carried: it records who granted the
      membership in one cluster, not what the schema is.
    type: array
    items:
      oneOf:
        - title: Role Name
          type: string
        - title: Membership With Options
          type: object
          properties:
            role:
              title: Role Name
              type: string
            admin:
              title: WITH ADMIN OPTION
              description: >
                Whether the member may in turn grant this role to others.
              type: boolean
            inherit:
              title: WITH INHERIT
              description: >
                Whether the member automatically uses this role's privileges.
                Omit to defer to the member role's own `inherit` option.
              type: boolean
            set:
              title: WITH SET
              description: >
                Whether the member may SET ROLE to this role.
              type: boolean
          required:
            - role
          additionalProperties: false
    uniqueItems: true
  languages:
    type: object
    propertyNames:
      pattern: ^([A-Za-z0-9_\-\.]+)$
    patternProperties:
      "^.*$":
        type: array
        items:
          pattern: "^(USAGE|ALL)( WITH GRANT OPTION)?$"
  large_objects:
    type: object
    propertyNames:
      pattern: ^[0-9]+$
    patternProperties:
      "^.*$":
        type: array
        items:
          pattern: "^(SELECT|UPDATE|ALL)( WITH GRANT OPTION)?$"
  roles:
    title: Role Memberships
    description: >
      Memberships in other roles. Each entry is the role name on its own when
      the membership behaves the way `GRANT <role> TO <member>` grants it, or a
      mapping when it does not.

      `admin: true` writes WITH ADMIN OPTION. `inherit` and `set` write the
      per-membership WITH INHERIT / WITH SET options, which need PostgreSQL 16
      or later; omit `inherit` to defer to the member role's own `inherit`
      option, which is what PostgreSQL does.

      The grantor (`GRANTED BY`) is not carried: it records who granted the
      membership in one cluster, not what the schema is.
    type: array
    items:
      oneOf:
        - title: Role Name
          type: string
        - title: Membership With Options
          type: object
          properties:
            role:
              title: Role Name
              type: string
            admin:
              title: WITH ADMIN OPTION
              description: >
                Whether the member may in turn grant this role to others.
              type: boolean
            inherit:
              title: WITH INHERIT
              description: >
                Whether the member automatically uses this role's privileges.
                Omit to defer to the member role's own `inherit` option.
              type: boolean
            set:
              title: WITH SET
              description: >
                Whether the member may SET ROLE to this role.
              type: boolean
          required:
            - role
          additionalProperties: false
    uniqueItems: true
  schemata:
    type: object
    propertyNames:
      pattern: ^([A-Za-z0-9_\-]+)$
    patternProperties:
      "^.*$":
        type: array
        items:
          pattern: "^(CREATE|USAGE|ALL)( WITH GRANT OPTION)?$"
  sequences:
    type: object
    propertyNames:
      pattern: ^([A-Za-z0-9_\-]+)\.([A-Za-z0-9_\-]+)$
    patternProperties:
      "^.*$":
        type: array
        items:
          pattern: "^(SELECT|UPDATE|USAGE|ALL)( WITH GRANT OPTION)?$"
  tables:
    type: object
    propertyNames:
      pattern: ^([A-Za-z0-9_\-]+)\.([A-Za-z0-9_\-]+)$
    patternProperties:
      "^.*$":
        type: array
        items:
          pattern: "^(SELECT|INSERT|UPDATE|DELETE|TRUNCATE|REFERENCES|TRIGGER|MAINTAIN|ALL)( WITH GRANT OPTION)?$"
  tablespaces:
    type: object
    propertyNames:
      pattern: ^([A-Za-z0-9_\-]+)$
    patternProperties:
      "^.*$":
        type: array
        items:
          pattern: "^(CREATE|USAGE|ALL)( WITH GRANT OPTION)?$"
  types:
    type: object
    propertyNames:
      pattern: ^([A-Za-z0-9_\-]+)\.([A-Za-z0-9_\-]+)$
    patternProperties:
      "^.*$":
        type: array
        items:
          pattern: "^(USAGE|ALL)( WITH GRANT OPTION)?$"
  views:
    type: object
    propertyNames:
      pattern: ^([A-Za-z0-9_\-]+)\.([A-Za-z0-9_\-]+)$
    patternProperties:
      "^.*$":
        type: array
        items:
          pattern: "^(SELECT|ALL)( WITH GRANT OPTION)?$"
additionalProperties: false
