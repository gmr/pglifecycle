---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://gmr.github.io/pglifecycle/schemata/column.json
title: Column
description: Defines a column in a table
type: object
properties:
  name:
    title: Name
    description: The column name
    type: string
  data_type:
    title: Data Type
    description: The column data type
    type: string
  nullable:
    title: Nullable
    description: Column is NULLABLE when True. Defaults to True.
    type: boolean
    default: True
  not_null_constraint:
    title: NOT NULL Constraint
    description: >
      The parts of the column's NOT NULL constraint that `nullable` cannot
      express (PostgreSQL 18 and later, where NOT NULL is a named
      constraint). Present only when the name is not the one PostgreSQL
      generates, `<table>_<column>_not_null`, or when the constraint is
      NO INHERIT. `nullable` stays authoritative for whether the constraint
      exists at all.
    type: object
    properties:
      name:
        type: string
      no_inherit:
        title: NO INHERIT
        description: >
          Whether the constraint is not inherited by this table's
          descendants.
        type: boolean
    additionalProperties: false
  default:
    title: Default Value
    description: Default value for the column.
    oneOf:
      - type: boolean
      - type: integer
      - type: number
      - type: string
  collation:
    title: Column Collation
    description: >
      Assigns a collation to the column (which must be of a collatable data type).
      If not specified, the column data type's default collation is used.
    type: string
  check_constraint:
    title: Check Constraint
    description: >
      Specifies an expression producing a Boolean result which new or updated rows
      must satisfy for an insert or update operation to succeed.
    type: string
  generated:
    title: Generated Column
    description: Options for specifying a generated column
    type: object
    properties:
      expression:
        title: Expression
        description: >
          The expression used to generate the column. Mutually exclusive with the
          sequence column.
        type: string
      kind:
        title: Generated Column Kind
        description: >
          Whether the expression is materialized on write (stored) or evaluated
          on read (virtual). PostgreSQL 18 makes virtual the default and pg_dump
          omits the keyword for a virtual column, so the kind is recorded rather
          than assumed. An absent value means stored, which is what project
          files written before this attribute existed have always built.
        enum:
          - stored
          - virtual
      sequence:
        title: Sequence Name
        description: >
          Specifies that the generated column value is provided by a sequence.
          Mutually exclusive with the expression attribute.
      sequence_behavior:
        title: Sequence Behavior
        description: >
          The clauses ALWAYS and BY DEFAULT determine how the sequence value is
          given precedence over a user-specified value in an INSERT statement.
          If ALWAYS is specified, a user-specified value is only accepted if
          the INSERT statement specifies OVERRIDING SYSTEM VALUE. If BY DEFAULT
          is specified, then the user-specified value takes precedence.
        enum:
          - ALWAYS
          - BY DEFAULT
      sequence_options:
        title: Identity Sequence Options
        description: >
          The options of an identity column's own sequence. Each is omitted
          when it holds PostgreSQL's default, so an identity that states none
          is an ordinary one starting at 1. Distinct from sequence, which names
          a sequence managed as its own object and is not rendered.
        type: object
        properties:
          name:
            title: Sequence Name
            description: >
              The sequence's schema-qualified name, present only when it is not
              the <table>_<column>_seq PostgreSQL generates.
            type: string
          start_with:
            title: Start With
            type: integer
          increment_by:
            title: Increment By
            type: integer
          min_value:
            title: Minimum Value
            type: integer
          max_value:
            title: Maximum Value
            type: integer
          cache:
            title: Cache
            type: integer
          cycle:
            title: Cycle
            description: Wrap around at the limit instead of raising an error.
            type: boolean
        additionalProperties: false
    oneOf:
      - required: [expression]
        not:
          anyOf:
            - required: [sequence]
            - required: [sequence_behavior]
            - required: [sequence_options]
      # An identity column: a pulled one carries only the behavior,
      # while older project files name a separate sequence
      - anyOf:
          - required: [sequence]
          - required: [sequence_behavior]
        # `kind` selects how an expression is materialized, so an
        # identity column has no use for it and the build ignores it.
        # Reject the pair instead of accepting a value that does
        # nothing.
        not:
          anyOf:
            - required: [expression]
            - required: [kind]
    additionalProperties: false
  storage:
    title: Storage
    description: >
      How the column's values are stored (SET STORAGE), when it differs
      from the type's default
    enum: [PLAIN, EXTERNAL, EXTENDED, MAIN, DEFAULT]
  compression:
    title: Compression
    description: The compression method for the column's values (SET COMPRESSION)
    type: string
  statistics:
    title: Statistics Target
    description: The column's statistics target (SET STATISTICS)
    type: integer
  options:
    title: Attribute Options
    description: >
      Per-column options such as n_distinct (ALTER COLUMN ... SET (...))
    type: object
  comment:
    title: Comment
    description: An optional comment about the column
    type: string
required:
  - name
  - data_type
additionalProperties: false
