---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://gmr.github.io/pglifecycle/schemata/collation.json
title: Collation
description: >
  A collation is a schema object that provides the locale rules used when
  sorting and comparing text.
type: object
properties:
  name:
    title: Name
    description: The name of the collation function to create.
    type: string
  schema:
    title: Schema
    description: The schema to create the collation function in.
    type: string
  owner:
    title: Owner
    description: The role that owns the collation function.
    type: string
  sql:
    title: SQL
    description: Raw SQL for the object
    type: string
  locale:
    title: Locale
    description: >
      This is a shortcut for setting lc_collate and lc_ctype at once. If you
      specify this, you cannot specify either of those parameters.
    type: string
  lc_collate:
    title: Locale Collation
    description: >
      Use the specified operating system locale for the LC_COLLATE locale category.
    type: string
  lc_ctype:
    title: Locale CType
    description: >
      Use the specified operating system locale for the LC_CTYPE locale category.
    type: string
  provider:
    title: Locale Provider
    description: >
      Specifies the provider to use for locale services associated with this
      collation. Possible values are: icu, libc. libc is the default. The
      available choices depend on the operating system and build options.
    enum: [icu, libc]
  version:
    title: Collation Version
    description: >
      Specifies the version string to store with the collation. Normally this
      should be omitted, which causes the version to be computed from the
      actual version of the collation as provided by the operating system.
    type: string
  deterministic:
    title: Deterministic Comparisons
    description: >
      Specifies whether the collation should use deterministic comparisons.
    type: boolean
    default: true
  copy_from:
    title: Source Collation
    description: Copy the collation from a pre-existing collation
    type: string
  comment:
    title: Comment
    description: An optional comment about the collation.
    type: string
  dependencies:
    title: Dependencies
    description: Database objects this object is dependent upon
    $package_schema: dependencies
required:
  - schema
  - name
  - owner
# A collation is defined one of three ways, and the forms do not mix: raw
# SQL, copied FROM another collation, or from locale settings (`provider`,
# `deterministic` and `version` only qualify those). The branches used to
# gate on a `version` property this schema never declared, and the third
# branch's `anyOf` gated on `properties`, which says nothing about an
# absent key -- so it matched everything and every `sql` or `copy_from`
# collation failed as "valid under each of" two branches.
oneOf:
  - required: [sql]
  - required: [copy_from]
  - anyOf:
      - required: [locale]
      - required: [lc_collate]
      - required: [lc_ctype]
