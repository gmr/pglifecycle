---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://gmr.github.io/pglifecycle/schemata/casts.json
title: Casts
description: Specifies all user-defined casts in a schema
type: object
properties:
  schema:
    title: Schema
    description: The schema every object in this file belongs to.
    type: string
  owner:
    title: Owner
    description: >
      The role that owns every object in this file, unless an entry names its
      own. Defaults to the project's superuser.
    type: string
  casts:
    title: User-defined casts
    type: array
    items:
      $package_schema: cast
required:
  - schema
  - casts
additionalProperties: false
